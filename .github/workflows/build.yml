name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Build Pluck.app
        run: ./build.sh

      - name: Test fixtures
        run: |
          python3 -m venv .venv && . .venv/bin/activate && pip install -q pillow
          python3 tests/make_fixture.py
          BIN=build/Pluck.app/Contents/MacOS/Pluck

          echo "::group::PNG (Stirling-compatible) mode"
          rm -rf out && "$BIN" --extract tests/fixture.pdf --out out
          python3 tests/verify.py "out/fixture images"
          echo "::endgroup::"

          echo "::group::keep-JPEG mode"
          rm -rf out && "$BIN" --extract tests/fixture.pdf --out out --keep-jpeg
          python3 tests/verify.py "out/fixture images" --keep-jpeg
          echo "::endgroup::"

          echo "::group::zip mode + name collision"
          rm -rf out && "$BIN" --extract tests/fixture.pdf --out out --zip
          "$BIN" --extract tests/fixture.pdf --out out --zip
          ls -la out
          test -f "out/fixture images.zip" && test -f "out/fixture images 2.zip"
          mkdir z && ditto -x -k "out/fixture images.zip" z
          python3 tests/verify.py "z/fixture images"
          echo "::endgroup::"

      - name: Package
        run: |
          mkdir -p dist/Pluck
          ditto build/Pluck.app dist/Pluck/Pluck.app
          cp install.sh uninstall.sh dist/Pluck/
          (cd dist && ditto -c -k --keepParent Pluck Pluck.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Pluck
          path: dist/Pluck.zip

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/Pluck.zip --title "Pluck (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.sh | bash" \
            --target "$GITHUB_SHA"
